name: Update Logistics Dashboard

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      content_hash: ${{ steps.check.outputs.content_hash }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install google-api-python-client

    - name: Check for changes
      id: check
      env:
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        CI: "true"
      run: |
        python check_changes.py > check_output.txt 2>&1
        if grep -q "NEEDS_UPDATE=true" check_output.txt; then
          echo "needs_update=true" >> $GITHUB_OUTPUT
        else
          echo "needs_update=false" >> $GITHUB_OUTPUT
        fi
        # Hand the hash to the update job, which records it only if the rebuild
        # works. Committing it here meant a failed rebuild still marked the data
        # as processed, so the next run skipped and the dashboard silently aged.
        echo "content_hash=$(python -c "import json; print(json.load(open('last_source_hash.json'))['content_hash'])")" >> $GITHUB_OUTPUT
        cat check_output.txt

  update-dashboard:
    needs: check-changes
    # A manual run always rebuilds, even when the hash says nothing changed.
    if: always() && needs.check-changes.result == 'success' && (needs.check-changes.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Update dashboard
      env:
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        python logistics_dashboard_updater.py

    # Only reached when the rebuild above actually succeeded.
    - name: Record processed hash
      if: needs.check-changes.outputs.content_hash != ''
      env:
        CONTENT_HASH: ${{ needs.check-changes.outputs.content_hash }}
      run: |
        python - <<'PY'
        import hashlib, json, os
        h = os.environ['CONTENT_HASH']
        json.dump({'content_hash': h,
                   'updated_at': hashlib.md5(str(h).encode()).hexdigest()},
                  open('last_source_hash.json', 'w'), indent=2)
        PY
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f last_source_hash.json
        if git diff --staged --quiet; then
          echo "hash unchanged, nothing to commit"
        else
          git commit -m "Update last processed timestamp [skip ci]"
          git pull --rebase -q origin master
          git push
        fi
